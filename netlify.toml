[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

# The legacy (2023) app registered a Workbox service worker at this path that
# precached the old index.html. Our replacement unregisters itself; never cache it.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Agent discovery: advertise the plain-text guide and sitemap on the homepage.
[[headers]]
  for = "/"
  [headers.values]
    Link = '</llms.txt>; rel="llms-txt", </sitemap.xml>; rel="sitemap"'

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Icons and manifest of the 2023 app, still referenced by old installs and caches.
[[redirects]]
  from = "/manifest.json"
  to = "/manifest.webmanifest"
  status = 301

[[redirects]]
  from = "/logo192.png"
  to = "/icon-192.png"
  status = 301

[[redirects]]
  from = "/logo512.png"
  to = "/icon-512.png"
  status = 301

[[redirects]]
  from = "/logo192_mask.png"
  to = "/maskable-512.png"
  status = 301

[[redirects]]
  from = "/logo512_mask.png"
  to = "/maskable-512.png"
  status = 301

# SPA fallback (functions and static files take precedence).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
