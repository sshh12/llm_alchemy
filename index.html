          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c; });

        if (s.motion === "reduce") document.documentElement.dataset.motion = "reduce";

      <main class="nojs">
        <h1>Infinite Alchemy</h1>
        <p><strong>Combine elements, discover anything.</strong> Infinite Alchemy is a free, AI-powered element-combining game. Start with Earth, Water, Air, Fire and Time and mix them into anything you can imagine: an AI names every new element and paints it in a handmade clay style.</p>
        <p>The game needs JavaScript. Please enable it to play.</p>
        <h2>How to play</h2>
        <ul>
          <li><strong>Combine:</strong> drag one element onto another on the workbench, or tap one and then another. Mix up to four at once.</li>
          <li><strong>Discover:</strong> each combination is decided once by the AI and stays the same for everyone. Make something nobody has made before and you earn a first discovery seal.</li>
          <li><strong>Go deep:</strong> rarity grows with every step from the starters. Clever combinations can land on famous people, places, myths, characters and brands.</li>
          <li><strong>Daily challenges:</strong> three new targets every day, easy, hard and expert.</li>
        </ul>
        <h2>About</h2>
        <p>Infinite Alchemy was one of the first games to invent brand-new elements with AI on demand. It is inspired by <a href="https://littlealchemy.com/">Little Alchemy</a> by Jakub Koziol, was made by <a href="https://sshh.io/">Shrivu Shankar</a>, and is <a href="https://github.com/sshh12/llm_alchemy">open source</a>. Read <a href="https://blog.sshh.io/p/infinite-alchemy">the launch story</a> or the <a href="/llms.txt">guide for AI agents</a>.</p>
      </main>
    </noscript>
